# Worker aparte: Cloudflare Pages no corre tareas programadas.
# Despliegue: npx wrangler deploy --config workers/resumen-cron/wrangler.toml
# Secreto: npx wrangler secret put RESUMEN_TOKEN --config workers/resumen-cron/wrangler.toml
name = "ajl-resumen-cron"
main = "index.js"
workers_dev = false # solo cron: sin URL pública
compatibility_date = "2026-10-01"

[triggers]
crons = ["0 13 * * *", "*/15 * * * *"] # 13:00 UTC = 8:00 en Lima; revisión de la agenda y de cobros cada 15 min

[vars]
RESUMEN_URL = "https://www.ajlnutricion.com/api/reservas/resumen-diario"
BARRIDO_URL = "https://www.ajlnutricion.com/api/suscripciones/barrido"
SALUD_URL = "https://www.ajlnutricion.com/api/reservas/salud-agenda"
REVISION_URL = "https://www.ajlnutricion.com/api/suscripciones/revision"
