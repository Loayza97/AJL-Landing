<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --verde: #2F6E52; --verde-osc: #173C2C; --verde-claro: #E9F1EB;
  --dorado: #D68A5C; --dorado-osc: #BE6E42; --dorado-claro: #F6E5D9;
  --crema: #FBF7F1; --ink: #20302A; --gris: #5E6B63; --white: #fff;
}
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; }
body {
  background: var(--crema); color: var(--ink);
  font-family: 'Inter', system-ui, sans-serif;
  display: flex; flex-direction: column;
  padding: 220px 90px 240px;   /* zonas seguras de Instagram arriba y abajo */
}
.kicker {
  font-size: 30px; font-weight: 700; letter-spacing: 6px; text-transform: uppercase;
  color: var(--dorado); margin-bottom: 18px;
}
.entry { font-size: 34px; line-height: 1.4; color: var(--ink); margin-bottom: 40px; }
.entry strong { color: var(--verde-osc); }
.card {
  position: relative; background: var(--white); border-radius: 44px;
  padding: 44px 44px 60px; box-shadow: 0 30px 80px rgba(23,60,44,.12);
  flex: 1; display: flex; flex-direction: column;
}
.card--acomp { border: 6px solid var(--dorado-claro); }
.art {
  background: var(--verde-claro); border-radius: 32px; padding: 60px 50px;
  flex: 1; display: flex; align-items: center; margin-bottom: 52px;
}
.card--acomp .art { background: var(--dorado-claro); }
.art svg { width: 100%; height: auto; max-height: 100%; }
.num {
  position: absolute; top: 20px; left: 20px; width: 120px; height: 120px; border-radius: 50%;
  display: grid; place-items: center; background: var(--verde-osc); color: var(--white);
  font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 62px;
  box-shadow: 0 12px 30px rgba(23,60,44,.3);
}
.card--acomp .num { background: var(--dorado); }
.tag {
  align-self: flex-start; font-size: 26px; font-weight: 700; letter-spacing: 3px;
  text-transform: uppercase; color: var(--dorado-osc); background: var(--dorado-claro);
  padding: 14px 30px; border-radius: 999px; margin-bottom: 26px;
}
h1 {
  font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 74px;
  line-height: 1.12; color: var(--verde-osc); letter-spacing: -1px; margin-bottom: 26px;
}
.line { font-size: 40px; line-height: 1.45; color: var(--gris); }
.line + .line { margin-top: 14px; }
.foot { margin-top: 40px; font-size: 32px; font-weight: 600; color: var(--verde-osc); }
.brand {
  position: absolute; left: 0; right: 0; bottom: 120px; text-align: center;
  font-size: 28px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; color: var(--verde);
}
/* Colores de los dibujos (heredan de la paleta) */
.f-osc      { fill: var(--verde-osc); }
.f-verde    { fill: var(--verde); }
.f-verde-op { fill: rgba(47, 110, 82, 0.35); }
.f-claro    { fill: var(--verde-claro); }
.f-terra    { fill: var(--dorado); }
.f-terra-op { fill: rgba(214, 138, 92, 0.4); }
.f-pale     { fill: var(--dorado-claro); }
.f-white    { fill: #fff; }
.f-wa       { fill: #25D366; }
.s-osc      { stroke: var(--verde-osc); stroke-width: 2; }
.s-verde    { stroke: var(--verde); stroke-width: 3; }
.s-verde-w  { stroke: var(--verde); stroke-width: 7; stroke-linecap: round; }
.s-terra    { stroke: var(--dorado); stroke-width: 2.5; stroke-linecap: round; }
.s-terra-w  { stroke: var(--dorado); stroke-width: 8; stroke-linecap: round; }
.s-white    { stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }


</style></head>
<body>
  <p class="kicker">Así funciona · Paso 3 de 5</p>
  
  <div class="card">
    <span class="num">3</span>
    <div class="art"><svg viewBox="0 0 240 160" class="hiw-svg">
                <!-- hojas de otros tipos de día, detrás -->
                <g transform="rotate(-10 60 84)">
                  <rect x="30" y="34" width="60" height="100" rx="8" class="f-claro" />
                  <rect x="40" y="46" width="14" height="24" rx="2" class="f-verde" />
                  <rect x="43" y="50" width="3" height="3" class="f-white" /><rect x="48" y="50" width="3" height="3" class="f-white" />
                  <rect x="43" y="56" width="3" height="3" class="f-white" /><rect x="48" y="56" width="3" height="3" class="f-white" />
                  <rect x="40" y="80" width="40" height="6" rx="3" class="f-verde-op" />
                  <rect x="40" y="92" width="32" height="6" rx="3" class="f-verde-op" />
                  <rect x="40" y="104" width="36" height="6" rx="3" class="f-verde-op" />
                </g>
                <g transform="rotate(10 180 84)">
                  <rect x="150" y="34" width="60" height="100" rx="8" class="f-pale" />
                  <circle cx="167" cy="56" r="7" class="f-terra" />
                  <path d="M167 44v-3M167 68v-3M155 56h-3M179 56h-3" class="s-terra" />
                  <rect x="160" y="80" width="40" height="6" rx="3" class="f-terra-op" />
                  <rect x="160" y="92" width="30" height="6" rx="3" class="f-terra-op" />
                  <rect x="160" y="104" width="36" height="6" rx="3" class="f-terra-op" />
                </g>
                <!-- teléfono con el plan del día -->
                <rect x="82" y="8" width="76" height="144" rx="12" class="f-osc" />
                <rect x="88" y="16" width="64" height="128" rx="8" class="f-white" />
                <rect x="108" y="20" width="24" height="3" rx="1.5" class="f-claro" />
                <!-- pestañas: hoy resaltada -->
                <rect x="94" y="30" width="18" height="8" rx="4" class="f-verde" />
                <rect x="115" y="30" width="14" height="8" rx="4" class="f-claro" />
                <rect x="132" y="30" width="14" height="8" rx="4" class="f-claro" />
                <!-- comidas como tarjetas -->
                <rect x="94" y="46" width="52" height="24" rx="5" class="f-claro" />
                <circle cx="102" cy="53" r="3" class="f-terra" />
                <rect x="108" y="51" width="26" height="4" rx="2" class="f-verde" />
                <rect x="100" y="60" width="38" height="4" rx="2" class="f-verde-op" />
                <rect x="94" y="76" width="52" height="24" rx="5" class="f-claro" />
                <circle cx="102" cy="83" r="3" class="f-terra" />
                <rect x="108" y="81" width="30" height="4" rx="2" class="f-verde" />
                <rect x="100" y="90" width="34" height="4" rx="2" class="f-verde-op" />
                <rect x="94" y="106" width="52" height="24" rx="5" class="f-claro" />
                <circle cx="102" cy="113" r="3" class="f-terra" />
                <rect x="108" y="111" width="22" height="4" rx="2" class="f-verde" />
                <rect x="100" y="120" width="40" height="4" rx="2" class="f-verde-op" />
              </svg></div>
    
    <h1>Recibes tu plan en la app.</h1>
    <p class="line">Incluye todo lo que conversamos en tu sesión.</p><p class="line">Desde que lo recibes corre tu mes.</p>
    
  </div>
  <p class="brand">AJL Nutrición</p>
</body></html>
