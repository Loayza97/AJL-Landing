<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --verde: #2F6E52; --verde-osc: #173C2C; --verde-claro: #E9F1EB;
  --dorado: #D68A5C; --dorado-osc: #BE6E42; --dorado-claro: #F6E5D9;
  --crema: #FBF7F1; --ink: #20302A; --gris: #5E6B63; --white: #fff;
}
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; }
body {
  background: var(--crema); color: var(--ink);
  font-family: 'Inter', system-ui, sans-serif;
  display: flex; flex-direction: column;
  padding: 220px 90px 240px;   /* zonas seguras de Instagram arriba y abajo */
}
.kicker {
  font-size: 30px; font-weight: 700; letter-spacing: 6px; text-transform: uppercase;
  color: var(--dorado); margin-bottom: 18px;
}
.entry { font-size: 34px; line-height: 1.4; color: var(--ink); margin-bottom: 40px; }
.entry strong { color: var(--verde-osc); }
.card {
  position: relative; background: var(--white); border-radius: 44px;
  padding: 44px 44px 60px; box-shadow: 0 30px 80px rgba(23,60,44,.12);
  flex: 1; display: flex; flex-direction: column;
}
.card--acomp { border: 6px solid var(--dorado-claro); }
.art {
  background: var(--verde-claro); border-radius: 32px; padding: 60px 50px;
  flex: 1; display: flex; align-items: center; margin-bottom: 52px;
}
.card--acomp .art { background: var(--dorado-claro); }
.art svg { width: 100%; height: auto; max-height: 100%; }
.num {
  position: absolute; top: 20px; left: 20px; width: 120px; height: 120px; border-radius: 50%;
  display: grid; place-items: center; background: var(--verde-osc); color: var(--white);
  font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 62px;
  box-shadow: 0 12px 30px rgba(23,60,44,.3);
}
.card--acomp .num { background: var(--dorado); }
.tag {
  align-self: flex-start; font-size: 26px; font-weight: 700; letter-spacing: 3px;
  text-transform: uppercase; color: var(--dorado-osc); background: var(--dorado-claro);
  padding: 14px 30px; border-radius: 999px; margin-bottom: 26px;
}
h1 {
  font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 74px;
  line-height: 1.12; color: var(--verde-osc); letter-spacing: -1px; margin-bottom: 26px;
}
.line { font-size: 40px; line-height: 1.45; color: var(--gris); }
.line + .line { margin-top: 14px; }
.foot { margin-top: 40px; font-size: 32px; font-weight: 600; color: var(--verde-osc); }
.brand {
  position: absolute; left: 0; right: 0; bottom: 120px; text-align: center;
  font-size: 28px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; color: var(--verde);
}
/* Colores de los dibujos (heredan de la paleta) */
.f-osc      { fill: var(--verde-osc); }
.f-verde    { fill: var(--verde); }
.f-verde-op { fill: rgba(47, 110, 82, 0.35); }
.f-claro    { fill: var(--verde-claro); }
.f-terra    { fill: var(--dorado); }
.f-terra-op { fill: rgba(214, 138, 92, 0.4); }
.f-pale     { fill: var(--dorado-claro); }
.f-white    { fill: #fff; }
.f-wa       { fill: #25D366; }
.s-osc      { stroke: var(--verde-osc); stroke-width: 2; }
.s-verde    { stroke: var(--verde); stroke-width: 3; }
.s-verde-w  { stroke: var(--verde); stroke-width: 7; stroke-linecap: round; }
.s-terra    { stroke: var(--dorado); stroke-width: 2.5; stroke-linecap: round; }
.s-terra-w  { stroke: var(--dorado); stroke-width: 8; stroke-linecap: round; }
.s-white    { stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }


</style></head>
<body>
  <p class="kicker">Así funciona · Paso 2 de 5</p>
  
  <div class="card">
    <span class="num">2</span>
    <div class="art"><svg viewBox="0 0 240 160" class="hiw-svg">
                <!-- siete días, con lo que pasa en cada uno -->
                <!-- L: oficina -->
                <rect x="10" y="26" width="26" height="90" rx="6" class="f-claro" />
                <rect x="16" y="44" width="14" height="30" rx="2" class="f-verde" />
                <rect x="19" y="49" width="3" height="3" class="f-white" /><rect x="24" y="49" width="3" height="3" class="f-white" />
                <rect x="19" y="56" width="3" height="3" class="f-white" /><rect x="24" y="56" width="3" height="3" class="f-white" />
                <rect x="19" y="63" width="3" height="3" class="f-white" /><rect x="24" y="63" width="3" height="3" class="f-white" />
                <!-- M: táper -->
                <rect x="42" y="26" width="26" height="90" rx="6" class="f-claro" />
                <rect x="47" y="54" width="16" height="14" rx="3" class="f-verde" />
                <rect x="45" y="50" width="20" height="5" rx="2" class="f-osc" />
                <!-- X: oficina -->
                <rect x="74" y="26" width="26" height="90" rx="6" class="f-claro" />
                <rect x="80" y="44" width="14" height="30" rx="2" class="f-verde" />
                <rect x="83" y="49" width="3" height="3" class="f-white" /><rect x="88" y="49" width="3" height="3" class="f-white" />
                <rect x="83" y="56" width="3" height="3" class="f-white" /><rect x="88" y="56" width="3" height="3" class="f-white" />
                <rect x="83" y="63" width="3" height="3" class="f-white" /><rect x="88" y="63" width="3" height="3" class="f-white" />
                <!-- J: restaurante (plato) -->
                <rect x="106" y="26" width="26" height="90" rx="6" class="f-claro" />
                <circle cx="119" cy="60" r="10" class="f-white s-osc" />
                <circle cx="119" cy="60" r="5" class="f-terra" />
                <!-- V: salida (copa) -->
                <rect x="138" y="26" width="26" height="90" rx="6" class="f-pale" />
                <path d="M143 48 L159 48 L151 62 Z" class="f-terra" />
                <rect x="150" y="62" width="2" height="9" class="f-terra" />
                <rect x="146" y="71" width="10" height="2" rx="1" class="f-terra" />
                <!-- S: descanso (sol) -->
                <rect x="170" y="26" width="26" height="90" rx="6" class="f-pale" />
                <circle cx="183" cy="58" r="7" class="f-terra" />
                <path d="M183 45v-4M183 75v-4M170 58h-4M200 58h-4M174 49l-3-3M195 70l-3-3M174 67l-3 3M195 46l-3 3" class="s-terra" />
                <!-- D: casa -->
                <rect x="202" y="26" width="26" height="90" rx="6" class="f-pale" />
                <path d="M205 60 L215 50 L225 60 Z" class="f-terra" />
                <rect x="208" y="60" width="14" height="12" class="f-terra" />
                <rect x="213" y="65" width="4" height="7" class="f-white" />
                <!-- puntos de día -->
                <circle cx="23" cy="132" r="3" class="f-verde" /><circle cx="55" cy="132" r="3" class="f-verde" />
                <circle cx="87" cy="132" r="3" class="f-verde" /><circle cx="119" cy="132" r="3" class="f-verde" />
                <circle cx="151" cy="132" r="3" class="f-terra" /><circle cx="183" cy="132" r="3" class="f-terra" />
                <circle cx="215" cy="132" r="3" class="f-terra" />
              </svg></div>
    
    <h1>Conversamos tu semana.</h1>
    <p class="line">Dónde almuerzas, qué pasa el viernes, qué pasa el domingo.</p>
    
  </div>
  <p class="brand">AJL Nutrición</p>
</body></html>
