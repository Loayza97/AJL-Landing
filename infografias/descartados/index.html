<!doctype html><html lang="es"><head><meta charset="utf-8">
<title>AJL · Mockups de la pieza</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--verde-osc:#173C2C;--terra-osc:#BE6E42;--gris:#5E6B63;--crema:#FBF7F1}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#e8e4dc;color:#20302A;padding:44px}
header{max-width:1500px;margin:0 auto 34px}
h1{font-family:'Fraunces',Georgia,serif;font-size:40px;color:var(--verde-osc);font-weight:600}
header p{color:var(--gris);margin-top:10px;font-size:17px;max-width:70ch;line-height:1.5}
.grid{max-width:1500px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
figure{background:var(--crema);border-radius:16px;overflow:hidden;
box-shadow:0 10px 30px rgba(23,60,44,.14);display:flex;flex-direction:column}
figcaption{padding:18px 20px}
.n{font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;
color:var(--terra-osc);margin-bottom:5px}
figcaption b{font-family:'Fraunces',Georgia,serif;font-size:22px;color:var(--verde-osc);
font-weight:600;display:block;margin-bottom:6px}
figcaption span{font-size:15px;color:var(--gris);line-height:1.45;display:block}
img{width:100%;display:block;border-top:1px solid rgba(23,60,44,.1)}
a.ver{display:inline-block;margin-top:12px;font-size:14px;font-weight:700;
color:var(--terra-osc);text-decoration:none}
a.ver:hover{text-decoration:underline}
@media (max-width:1200px){.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<header>
  <h1>Seis formas de contar la cita y el plan</h1>
  <p>Todas en vertical, con la marca al pie, listas para mandar por WhatsApp como imagen. La sexta es la única que no promete mediciones que a veces no se pueden hacer.</p>
</header>
<div class="grid">
  <figure><figcaption><p class="n">Opción 1</p><b>Dos cajas</b>
    <span>La respuesta literal. Rápida de leer, fácil de mantener, sin gancho.</span>
    <a class="ver" href="1-dos-cajas.html" target="_blank">Abrir sola →</a></figcaption>
    <img src="1-dos-cajas.png" alt="Dos cajas"></figure>
  <figure><figcaption><p class="n">Opción 2</p><b>Los 60 minutos</b>
    <span>La hora por tramos. La que mejor justifica el precio.</span>
    <a class="ver" href="2-los-60-minutos.html" target="_blank">Abrir sola →</a></figcaption>
    <img src="2-los-60-minutos.png" alt="Los 60 minutos"></figure>
  <figure><figcaption><p class="n">Opción 3</p><b>Llegas y te vas</b>
    <span>La única emocional. Promete un cambio de estado en una hora.</span>
    <a class="ver" href="3-llegas-te-vas.html" target="_blank">Abrir sola →</a></figcaption>
    <img src="3-llegas-te-vas.png" alt="Llegas y te vas"></figure>
  <figure><figcaption><p class="n">Opción 4</p><b>La ficha</b>
    <span>Formato ficha técnica. La mejor para responder por WhatsApp. La más fría.</span>
    <a class="ver" href="4-la-ficha.html" target="_blank">Abrir sola →</a></figcaption>
    <img src="4-la-ficha.png" alt="La ficha"></figure>
  <figure><figcaption><p class="n">Opción 5</p><b>Lo que no vas a encontrar</b>
    <span>Contra la competencia, con lo ajeno tachado. La más persuasiva y la más arriesgada.</span>
    <a class="ver" href="5-no-es-si-es.html" target="_blank">Abrir sola →</a></figcaption>
    <img src="5-no-es-si-es.png" alt="No es, si es"></figure>
  <figure><figcaption><p class="n">Opción 6</p><b>No hacemos la misma consulta</b>
    <span>La adaptación como argumento. Cuatro perfiles, y solo promete peso y talla.</span>
    <a class="ver" href="6-no-somos-iguales.html" target="_blank">Abrir sola →</a></figcaption>
    <img src="6-no-somos-iguales.png" alt="No somos iguales"></figure>
</div>
</body></html>
